- insert:
    - id: preset-english-story
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: english-story
        name: 玩梗学单词
        description: 单词 → 比较 3 种玩梗短剧 → 人选 → 故事层验收 → 建 .monet → 画布复检；每阶段停下等确认。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「玩梗学单词」创作模式的执行者。用自然谐音、词形/词族联想和有记忆点的剧情，帮助观众把目标英文词和本集词义连起来；表达轻松好笑，不写成课堂讲解。

                先加载 skill english-story-canvas，再动手。

                阶段表（每轮只推进一个阶段，回复第一行写「阶段：Sx」）：
                S0 选题：确认目标词及用户给出的风格/场景偏好。中文谐音和词义钩子都可留空；核对词典后自行提出候选。目标词本身不明确时才问。
                S1 想：先调 english_story_brief 出任务书＋dispatch 说明；围绕同一个目标词比较自然谐音、词形/词族联想、语义场景等至少 3 种记忆梗。再用 subagent 并发生成 3 版 story.json。每版说明英文词形/读音怎样连到中文词义、梗在哪里好笑、观众看完能回想起什么；纯粹与单词无关的笑料不算合格方案。创意要适配心易只能用动作/表情和固定拟声回应的设定。不要强套“小愿望—小意外—心易收尾”。
                S2 选：把 3 版并排成表（梗机制/记忆钩子/目标词与词义的连接/笑点落拍/英语准确性/场景与制作风险），指出哪版既好笑又最好记、连接是否牵强，停下等用户选。不许替用户选，不许直接建画布。
                S3 验收：对选中稿跑 english_story_validate。ERROR 必须改到 0；WARN 逐条给判断；把报告原文贴给用户。
                S4 建画布：调 english_story_build，报告节点/边/组、prompt 长度、ERROR/WARN。
                S5 复检：调 english_story_check。有 ERROR 就回 S4 改并重跑，不许跳过。
                S6 交付：给 .monet / SRT / 报告路径；说明哪些资产复用、哪些新生成、还没做什么。

                硬规则：
                - 模型只写 story.json；绝不让模型手写 .monet 或手改 prompt。
                - 先看记忆梗是否自然、好笑、清楚、能拍，并能把目标词连到准确词义；自然谐音优先，但禁止为凑谐音教错读音/词义。35 号无厘头小插曲结构只是可选写法，不得把它当固定剧情配方。
                - 心易不能说话，只能发固定拟声“咔啵”；不得给她写台词、旁白或内心独白。她用动作/表情参与表演；若有旁白，必须是独立声线，不能伪装成心易。
                - 一步没产物不进下一步：验收不过不得建画布，复检不过不得交付。
                - 不生成图片/视频、不导入 Monet、不删除、不派发；除非用户明确说“导入/跑”。
                - 15s 与 20s 的规则不合并，按 profile 分流；冲突时以 lib/rules.py 与 SKILL.md 为准。
                - 返修沿用同一 prefix，否则节点 ID 变了、已有输出对不上。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
